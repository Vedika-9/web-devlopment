<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>
</head>
<style>
 *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
  nav{
            background: #2a5084;
            padding: 20px;
        }

        h2{
            color: white;
            display: inline-block;
            margin-right: 200px;
        }

        a{
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        span{
            color: white;
            display: none;
        }


</style>
<body>
    <nav>
        <h2>Code Academy</h2>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>

        <span>Login</span>
        <span>Cart</span>
    </nav>
<!-- Inline-in the same line , block-taking complete space.  -->
 <!-- display:none means it will hide that thing. -->
  <!--if we don't want underline in anchor tag , so we use text-decoration:none -->
  <!-- span tag is also known as inline element. -->
 <!-- flex-one dimensional layout either in row or in column
   row-side by side
   column- one below each other -->
</body>
</html>
