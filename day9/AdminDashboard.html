<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
         .container{
            display: grid;

            grid-template-columns: 250px 1fr;

            grid-template-rows: 80px  auto   80px;

            gap: 10px;

            border: 1px solid black;
        }

        header{
         grid-column: 1/3;
            /* starts with 1 and end before column 3 */
         background: #7771e9;
            padding: 20px;
        }

        aside{
            background: #b95959;
            padding: 20px;
        }

        main{
            background: aqua;
            padding: 20px;
        }

         footer{
             grid-column: 1/3;
            background: #333;
            color: white;
            padding: 20px;
        
        }

    </style>
</head>
<body>
     <div class="container">
        <header>Header</header>

        <aside>Sider Bar</aside>

        <main>
            Main Content
        </main>

        <footer>
            Footer
        </footer>
    </div>
</body>
<!-- aside tag is used for creating side bar. -->
 <!-- grid column: 1/3 means starts with 1 and end before column 3. -->
  <!-- note: this is a layout and can be used for student portal, banking dashboard, CRM, admin panel.-->
 </html>
