<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
// https://randomuser.me/api/
// fetch('API_Address')
// Rule : after you get data from the API convert the Response into  JSON(JS-javascript, O-object , N- Notation) format data
// to identify json format see if both right and left side key-value contains double quotes.

fetch('https://randomuser.me/api/')

//successful
.then( response => response.json())
.then( data => console.log(data))     // => is arrow function
.then( data => console.log(data.results))   // only specific data

  //.the() , .catch() - a built in method in js

//Error
.catch(function(error){  // this is used when the api name or anything is wrong , then only it is used.
 console.log('Error Connection',error)
} )       
//catch- catches all the errors if you are not able to get the data
// every time you refresh  you get new data of  random person's details in this api.
</script>
</body>
</html>
