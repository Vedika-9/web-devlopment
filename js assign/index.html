    <script>
//1. variables
let name = "Vedika";
let age = 19;
console.log("Name:", name);
console.log("Age:", age);

//2. Operators
let num = 12;

// Check Even or Odd
if (num % 2 === 0) {
    console.log(num + " is Even");
} else {
    console.log(num + " is Odd");
}


//3.Function
function addNumbers(a, b) {
    return a + b;
}

let result = addNumbers(10, 20);
console.log("Sum:", result);
    </script>
